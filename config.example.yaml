# Example configuration for a fictional "acme-shop" repository.
# Copy it to config.local.yaml (untracked) and adapt it to your codebase.
extends: config.yaml

embedding_dim: 384
max_bytes: 5000000

# Directories or globs (relative to the project root) to index.
include_dirs:
  - src
  - docs
  - web/*.html

# Never index secrets or local runtime data.
exclude_globs:
  - "*.env*"
  - ".local/**"
  - "**/secrets/**"
never_index_ext:
  - ".pfx"
  - ".pem"
  - ".key"

# Optional: restrict an assets tree to its template subfolder.
assets_template_only: false
assets_root_dir: web/assets
assets_template_dir: web/assets/template

# PostgreSQL text search configuration used for keyword search.
# "simple" works for any language. See README for creating italian_unaccent.
fts_config: simple

# Query keywords that narrow retrieval to a path prefix (posix separators).
scope_map:
  src/billing/:
    - billing
    - invoice
  src/catalog/:
    - catalog
    - product listing
  web/:
    - frontend
    - html page

# Rewrite path fragments in queries, e.g. a moved folder.
path_aliases:
  web/assets/pdf/: web/assets/template/pdf/

# Used by map_work_item_to_codebase to infer the product touched by a ticket:
# product name -> tokens matched against repository name and paths.
product_targets:
  storefront:
    - storefront
    - web
  backoffice:
    - admin
    - backoffice
product_aliases:
  shop: storefront

projects_registry_path: projects.yaml
projects_state_path: .local/runtime/projects.state.json
ingest_enabled: false
write_enabled: false
