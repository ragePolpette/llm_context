[project]
name = "llm-memory-indexer"
version = "0.1.0"
description = "RAG memory + context indexer"
requires-python = ">=3.10"
dependencies = [
  "psycopg[binary]>=3.1",
  "psycopg_pool>=3.1",
  "pgvector>=0.2.3",
  "sentence-transformers>=2.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
symbols = [
  "tree-sitter>=0.22",
  "tree-sitter-python>=0.23",
  "tree-sitter-javascript>=0.23",
  "tree-sitter-typescript>=0.23",
]
