[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-context"
dynamic = ["version"]
description = "Local-first MCP retrieval server for technical context from code and documents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "aiohttp>=3.9",
  "psycopg[binary]>=3.1",
  "psycopg_pool>=3.1",
  "pgvector>=0.2.3",
  "sentence-transformers>=2.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
symbols = [
  "tree-sitter>=0.22",
  "tree-sitter-python>=0.23",
  "tree-sitter-javascript>=0.23",
  "tree-sitter-typescript>=0.23",
]
dev = [
  "pytest>=7",
  "pytest-asyncio>=0.23",
  "ruff>=0.17.0",
]

[project.scripts]
llm-context = "rag_indexer.cli:main"

[tool.setuptools]
packages = ["rag_indexer"]
py-modules = ["mcp_server", "mcp_server_http", "mcp_proxy"]

[tool.setuptools.dynamic]
version = { attr = "rag_indexer.__version__" }

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [".local", "docs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
