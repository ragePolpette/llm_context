# Default runtime configuration. Keep machine-specific overrides in an untracked
# config.local.yaml that starts with `extends: config.yaml`, then point
# LLM_CONTEXT_CONFIG_PATH (or `--config`) at it. See config.example.yaml.
embedding_dim: 384
ivfflat_lists: 100
max_bytes: 5000000
chunk_size: 1200
chunk_overlap: 300
md_chunk_size: 1600
code_chunk_size: 2500
min_chunk_chars: 200
include_dirs: []
assets_template_only: false
incremental_ingest: true
vector_weight: 0.5
keyword_weight: 0.5
max_chunks_per_doc: 5
min_score: 0.20
min_score_floor: 0.15
header_penalty: 0.05
default_doc_type: code
fts_config: simple
exclude_globs:
  - "*.env*"
  - ".local/**"
never_index_ext:
  - ".pfx"
  - ".pem"
  - ".key"
  - ".cer"
scope_map: {}
path_aliases: {}
product_targets: {}
product_aliases: {}
projects_registry_path: projects.yaml
projects_state_path: .local/runtime/projects.state.json
ingest_enabled: false
write_enabled: false
